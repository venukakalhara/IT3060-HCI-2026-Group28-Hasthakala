name: hasthakala
description: "Hasthakala - Sri Lankan Artisan & Handicraft Marketplace Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Services
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # Utilities & Helpers
  intl: ^0.20.3
  uuid: ^4.5.1
  cached_network_image: ^4.0.4

  # UI & Icons
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # Plus Jakarta Sans (SIL Open Font Licence - assets/fonts/PlusJakartaSans-OFL.txt)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

# app icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21

# launch screen: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAF7F2"
  image: assets/images/hasthakala_logo.png
  android_12:
    color: "#FAF7F2"
    image: assets/icon/splash_android12.png
  ios: false
  web: false
